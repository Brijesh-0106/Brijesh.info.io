name: CI/CD DEPLOYMENT

on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Code
        uses: actions/checkout@v3
      - name: Docker Installation
        uses: docker/setup-buildx-action@v3
      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: Push Image
        run: |
          docker build -t brijesh408/portfolio:v${{github.run_number}} .
          docker push brijesh408/portfolio:v${{github.run_number}}
  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Server Deployment
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          key: ${{secrets.SSH_KEY}}
          script: |
            PREV_RUN = $(( ${{github.run_number}} - 1 ))
            sudo docker pull brijesh408/portfolio:v${{github.run_number}}
            sudo docker stop portfolio || true
            sudo docker rm portfolio || true
            sudo docker rmi brijesh408/portfolio:v${{PREV_RUN}} || true
            sudo docker run -d --restart unless-stopped -e GROQ_API_KEY=${{secrets.GROQ_API_KEY}} --name portfolio -p 3001:3000 brijesh408/portfolio:v${{github.run_number}}
            sleep 5
            sudo docker ps
